<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ระบบจัดการค่ารอบไรเดอร์</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { themeMain: '#ea580c' } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root { --theme-main: #ea580c; } 
    * { font-family:'Kanit', sans-serif; transition: 0.2s; } 
    body { background-color: #f8f9fa; }
    .bg-main { background-color: var(--theme-main); }
    .text-main { color: var(--theme-main); }
    
    .sidebar-link { display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem; border-radius:.5rem; color:rgba(255,255,255,0.7); cursor:pointer; }
    .sidebar-link:hover { background:rgba(255,255,255,0.1); color:#fff; } 
    .sidebar-link.active { background:rgba(255,255,255,0.2); color:#fff; border-left: 4px solid #fff; }
    
    .input { width:100%; padding:.6rem 1rem; border:1px solid #d1d5db; border-radius:.75rem; outline:none; font-size:.875rem; background:#fff; } 
    .input:focus { border-color:var(--theme-main); box-shadow:0 0 0 3px rgba(234, 88, 12, 0.2); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.7rem 1rem; border-radius:.75rem; font-weight:600; cursor:pointer; font-size:.875rem; border:none; }
    .btn-primary { background: linear-gradient(135deg, #ea580c, #f97316); color:#fff; } 
    .btn-primary:active { transform:scale(0.98); }
    .btn-secondary { background:#e5e7eb; color:#374151; }
    
    .badge-paid { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-pending { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-800">

<!-- หน้าต่าง Login -->
<div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-[100]">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md relative text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-main text-white text-4xl mb-4 shadow-lg shadow-orange-500/30"><i class="fa-solid fa-motorcycle"></i></div>
    <h1 class="text-2xl font-bold text-slate-800">Rider Tracking</h1>
    <p class="text-sm text-slate-500 mt-1 mb-2">ระบบบันทึกและคำนวณค่ารอบ</p>
    
    <p class="text-xs font-mono text-slate-400 mt-1">Version: 10.0 (Secure RBAC)</p>
    <p class="text-xs font-mono text-slate-500 mt-0.5 font-medium">Dev: Kitti Prapakarn</p>
    
    <div class="space-y-4 mt-6 text-left">
      <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">ชื่อผู้ใช้งาน</label><input id="loginUser" type="text" class="input bg-slate-50" /></div>
      <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">รหัสผ่าน</label><input id="loginPass" type="password" class="input bg-slate-50" /></div>
      <button id="btnLogin" onclick="doLogin()" class="btn btn-primary w-full py-3 text-base mt-2 shadow-md">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- โครงสร้างหลักแอป -->
<div id="app" class="hidden h-[100dvh] w-full flex flex-col relative pb-16">
  
  <header class="bg-white border-b px-5 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <h1 id="pageTitle" class="text-xl font-bold text-slate-800 tracking-wide">หน้าแรก</h1>
    <button onclick="loadCurrentPage()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 active:scale-95"><i class="fa-solid fa-arrows-rotate"></i></button>
  </header>

  <main id="content" class="flex-1 overflow-y-auto p-4 md:p-6 pb-28 w-full max-w-3xl mx-auto"></main>

  <!-- แถบเมนูล่าง -->
  <nav class="fixed bottom-0 left-0 w-full bg-white border-t flex justify-around items-center z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] pb-safe pt-2 px-2">
    <button onclick="navigate('dashboard')" class="nav-btn flex flex-col items-center text-main w-[20%]" data-page="dashboard">
      <i class="fa-solid fa-motorcycle text-xl mb-1"></i><span class="text-[9px] font-medium">หน้าแรก</span>
    </button>
    <button onclick="navigate('orders')" class="nav-btn flex flex-col items-center text-slate-400 w-[20%]" data-page="orders">
      <i class="fa-solid fa-list text-xl mb-1"></i><span class="text-[9px] font-medium">ประวัติงาน</span>
    </button>
    
    <!-- ปุ่มเพิ่มงานตรงกลาง -->
    <div class="w-[20%] flex justify-center -mt-8 relative z-10">
      <button onclick="openOrderForm()" class="bg-main text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-orange-500/40 hover:scale-105 active:scale-95 border-4 border-white">
        <i class="fa-solid fa-plus text-2xl"></i>
      </button>
    </div>

    <button onclick="navigate('report')" class="nav-btn flex flex-col items-center text-slate-400 w-[20%]" data-page="report">
      <i class="fa-solid fa-file-invoice-dollar text-xl mb-1"></i><span class="text-[9px] font-medium">รอบบิล</span>
    </button>
    <button onclick="openMyProfile()" class="nav-btn flex flex-col items-center text-slate-400 w-[20%]">
      <i class="fa-solid fa-user text-xl mb-1"></i><span class="text-[9px] font-medium">ฉัน</span>
    </button>
  </nav>
</div>

<!-- Modal Form -->
<div id="modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 pb-safe">
  <div id="modalCard" class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-h-[90vh] flex flex-col mx-auto max-w-lg animate-[slideUp_0.3s_ease-out]">
    <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50 rounded-t-3xl">
      <h3 id="modalTitle" class="font-bold text-lg text-slate-800">Modal</h3>
      <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modalBody" class="p-6 overflow-y-auto flex-1 scrollbar-thin"></div>
    <div id="modalFooter" class="px-6 py-4 border-t bg-white flex justify-end gap-3"></div>
  </div>
</div>

<script>
// ==============================================================================
// 🚨 วาง URL ของ Google Apps Script ที่ Deploy เสร็จแล้ว มาวางในนี้ 🚨
// ==============================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyvEUsZ10qx0JG5HdmHY1sqJkRPBpFuHKUPyyvUIN3cIz7ogY-8Kwn-4e637QMirs4w/exec"; 

function gas(fn, ...args) {
  return new Promise(async function(resolve, reject) {
    try {
      const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args }) });
      const res = await response.json();
      if (res.status === 'success') { resolve(res.data); } else { reject(new Error(res.message)); }
    } catch (err) { reject(err); }
  });
}

const State = { user: null, currentPage: 'dashboard', cache: {} };

function el(id) { return document.getElementById(id); } 
function show(id) { if(el(id)) el(id).classList.remove('hidden'); } 
function hide(id) { if(el(id)) el(id).classList.add('hidden'); }

function openModal(title, body, footer) { el('modalTitle').textContent = title; el('modalBody').innerHTML = body; el('modalFooter').innerHTML = footer; show('modal'); }
function closeModal() { hide('modal'); } 
function escapeHtml(text) { return String(text || '').replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'}[c]; }); }
function errorHtml(error) { return "<div class='bg-white p-8 rounded-2xl text-center text-red-500 border'><i class='fa-solid fa-triangle-exclamation text-4xl mb-4 opacity-70'></i><p>" + escapeHtml(error.message || error) + "</p></div>"; }

function doLogin() {
  const btn = el('btnLogin'); const user = el('loginUser').value.trim(); const pass = el('loginPass').value.trim();
  if (!user || !pass) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบ', 'warning');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  gas('login', user, pass).then(res => {
    if (res.ok) { State.user = res.user; sessionStorage.setItem('user', JSON.stringify(res.user)); initApp(); } 
    else { Swal.fire('ผิดพลาด', res.message, 'error'); btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ'; }
  }).catch(e => { Swal.fire('Error', e.message, 'error'); btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ'; });
}
function logout() { sessionStorage.removeItem('user'); window.location.reload(); }

function initApp() {
  hide('loginScreen'); show('app'); navigate('dashboard');
}

const PAGE_INFO = { dashboard:'งานของฉันวันนี้', orders:'ประวัติงานทั้งหมด', report:'สรุปบิลและเบิกจ่าย', users:'จัดการพนักงาน' };

function navigate(page) {
  State.currentPage = page; 
  document.querySelectorAll('.nav-btn').forEach(l => { 
    if(l.dataset.page === page) { l.classList.add('text-main'); l.classList.remove('text-slate-400'); } 
    else { l.classList.remove('text-main'); l.classList.add('text-slate-400'); }
  });
  el('pageTitle').textContent = PAGE_INFO[page]; 
  loadCurrentPage();
}

function loadCurrentPage() { 
  el('content').innerHTML = `<div class='flex justify-center p-10'><i class="fa-solid fa-circle-notch fa-spin text-3xl text-main"></i></div>`; 
  if(window['render_' + State.currentPage]) { window['render_' + State.currentPage](); }
}

async function openMyProfile() {
  el('modalTitle').textContent = "โปรไฟล์ของฉัน"; el('modalBody').innerHTML = "<div class='flex justify-center py-10'><i class='fa-solid fa-spinner fa-spin text-2xl'></i></div>"; el('modalFooter').innerHTML = "<button onclick='closeModal()' class='btn btn-secondary mr-auto'>ปิด</button>"; show('modal');
  let profileHtml = `
    <div class="text-center mb-4"><div class="w-20 h-20 bg-orange-100 text-orange-600 rounded-full mx-auto flex items-center justify-center text-4xl mb-3 border-4 border-orange-200"><i class="fa-solid fa-user-ninja"></i></div><h3 class="font-bold text-lg">${State.user.FullName}</h3><p class="text-xs text-slate-500 uppercase">${State.user.Role}</p></div>
    <div class="space-y-3 text-left">
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">รหัสพนักงาน</label><input class="input bg-slate-100" value="${State.user.EmpID||'-'}" disabled></div>
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">ชื่อ-นามสกุล <span class="text-red-500">*</span></label><input id="mp_name" class="input" value="${escapeHtml(State.user.FullName)}"></div>
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">เปลี่ยนรหัสผ่าน (เว้นว่างถ้าไม่เปลี่ยน)</label><input id="mp_pass" type="password" class="input" placeholder="รหัสผ่านใหม่..."></div>
      ${State.user.Role === 'admin' ? `<button onclick="closeModal();navigate('users')" class="w-full mt-2 py-3 bg-slate-800 text-white rounded-xl font-bold shadow-md active:scale-95"><i class="fa-solid fa-users-gear mr-2"></i> จัดการข้อมูลพนักงาน</button>` : ''}
      <button onclick="logout()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-bold border border-red-200 active:scale-95 mt-4"><i class="fa-solid fa-right-from-bracket mr-2"></i> ออกจากระบบ</button>
    </div>`;
  el('modalBody').innerHTML = profileHtml; el('modalFooter').innerHTML = "<button onclick='closeModal()' class='btn btn-secondary mr-auto'>ยกเลิก</button><button id='btnSaveMyProf' onclick='saveMyProfile()' class='btn btn-primary px-6'>อัปเดตข้อมูล</button>";
}

async function saveMyProfile() {
  const data = { UserID: State.user.UserID, FullName: el('mp_name').value };
  const pass = el('mp_pass').value.trim(); if (pass) data.Password = pass;
  if (!data.FullName) return toast('กรุณาใส่ชื่อของคุณ', 'warning');
  const btn = el('btnSaveMyProf'); btn.disabled = true; btn.innerHTML = 'กำลังบันทึก...';
  try { await gas('updateMyProfile', data); State.user.FullName = data.FullName; sessionStorage.setItem('user', JSON.stringify(State.user)); closeModal(); toast('อัปเดตข้อมูลแล้ว', 'success'); } catch(e) { toast(e.message, 'error'); btn.disabled = false; btn.innerHTML = 'อัปเดตโปรไฟล์'; }
}

/* ========================================================
   ระบบคำนวณค่ารอบ
   ======================================================== */
window.calcFeeUI = function() {
  const distInput = parseFloat(el('pf_distance').value) || 0;
  const unit = el('pf_unit').value;
  let distanceMeters = unit === 'km' ? distInput * 1000 : distInput;
  let fee = 0;
  if (distanceMeters > 0) {
    if (distanceMeters <= 300) fee = 5;
    else if (distanceMeters <= 500) fee = 10;
    else if (distanceMeters <= 3000) fee = 15;
    else fee = 25;
  }
  el('pf_fee_disp').textContent = fee; el('pf_fee').value = fee; el('pf_dist_km').value = (distanceMeters/1000).toFixed(2);
}

function openOrderForm(orderId) {
  let d = { OrderID:'', OrderRef:'', DistanceKM: '', FeeTHB: 0, CustomerName:'', TotalPrice:'', PaymentMethod:'เงินสด' };
  if (orderId && State.cache.orders) { const found = State.cache.orders.find(p => p.OrderID === orderId); if (found) d = found; }
  
  let prefix = 'CPTH'; let numOnly = '';
  if (d.OrderRef.startsWith('AMTH')) { prefix = 'AMTH'; numOnly = d.OrderRef.replace('AMTH',''); }
  else if (d.OrderRef.startsWith('CPTH')) { prefix = 'CPTH'; numOnly = d.OrderRef.replace('CPTH',''); }
  else { numOnly = d.OrderRef; }

  const todayStr = new Date().toISOString().substring(0,10);

  openModal(d.OrderID ? 'แก้ไขออเดอร์' : 'เพิ่มออเดอร์ใหม่', `
    <div class="space-y-4 text-sm">
      <input type="hidden" id="pf_id" value="${d.OrderID}">
      <input type="hidden" id="pf_fee" value="${d.FeeTHB}">
      <input type="hidden" id="pf_dist_km" value="${d.DistanceKM}">
      <input type="hidden" id="pf_date" value="${todayStr}">
      
      <div class="bg-gradient-to-r from-orange-500 to-amber-400 p-4 rounded-2xl text-center text-white shadow-md">
        <p class="text-[10px] font-bold uppercase opacity-80 mb-1">ค่าจัดส่งที่คำนวณได้</p>
        <div class="text-5xl font-black"><span id="pf_fee_disp">${d.FeeTHB}</span> <span class="text-xl">฿</span></div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">เลขที่ออเดอร์ (Order No.) <span class="text-red-500">*</span></label>
        <div class="flex gap-2">
          <select id="pf_prefix" class="input w-1/3 font-bold bg-slate-50 text-center text-main border-none">
            <option value="CPTH" ${prefix==='CPTH'?'selected':''}>CPTH</option>
            <option value="AMTH" ${prefix==='AMTH'?'selected':''}>AMTH</option>
          </select>
          <input id="pf_num" type="number" class="input w-2/3 font-mono text-lg bg-slate-50 border-none" value="${numOnly}" placeholder="ระบุตัวเลข (เช่น 1234)">
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">ระยะทางการส่ง <span class="text-red-500">*</span></label>
        <div class="flex gap-2">
          <input id="pf_distance" type="number" class="input w-2/3 text-lg font-bold text-blue-600 bg-slate-50 border-none" value="${d.DistanceKM ? d.DistanceKM * 1000 : ''}" placeholder="ใส่ระยะทาง" oninput="calcFeeUI()">
          <select id="pf_unit" class="input w-1/3 bg-slate-50 border-none font-bold" onchange="calcFeeUI()">
            <option value="m">เมตร (m)</option><option value="km">กิโล (km)</option>
          </select>
        </div>
        <p class="text-[9px] text-slate-400 mt-1.5 ml-1 text-center font-medium bg-slate-100 rounded-lg py-1">0-300m = 5฿ | 301-500m = 10฿ | 501-3km = 15฿ | >3km = 25฿</p>
      </div>

      <div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">ชื่อลูกค้า (ตัวเลือก)</label><input id="pf_cust" type="text" class="input bg-slate-50 border-none" value="${d.CustomerName}" placeholder="ระบุชื่อลูกค้า"></div>
      
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">ยอดเก็บเงินลูกค้า</label><input id="pf_total" type="number" class="input bg-slate-50 border-none" value="${d.TotalPrice}" placeholder="บาท"></div>
        <div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">วิธีชำระเงิน</label><select id="pf_pay" class="input bg-slate-50 border-none"><option ${d.PaymentMethod==='เงินสด'?'selected':''}>เงินสด</option><option ${d.PaymentMethod==='โอน/เครดิต'?'selected':''}>โอน/เครดิต</option><option ${d.PaymentMethod==='TrueWallet'?'selected':''}>TrueWallet</option></select></div>
      </div>
    </div>
  `, `<button onclick="closeModal()" class="btn btn-secondary py-3 flex-1">ยกเลิก</button><button id="btnSaveOrder" onclick="saveOrderFunc()" class="btn btn-primary px-6 py-3 flex-1">บันทึกงาน</button>`);
  if(d.OrderID) { el('pf_unit').value = 'km'; calcFeeUI(); }
}

async function saveOrderFunc() {
  const num = el('pf_num').value.trim(); const dist = parseFloat(el('pf_distance').value);
  if (!num) return toast('กรุณาระบุเลขที่ออเดอร์', 'warning');
  if (isNaN(dist) || dist < 0) return toast('กรุณาระบุระยะทางให้ถูกต้อง', 'warning');
  
  const finalRef = el('pf_prefix').value + num;
  const data = { OrderID: el('pf_id').value, OrderDate: el('f_date') ? el('f_date').value : new Date().toISOString().substring(0,10), OrderRef: finalRef, CustomerName: el('pf_cust').value, DistanceKM: el('pf_dist_km').value, FeeTHB: el('pf_fee').value, PaymentMethod: el('pf_pay').value, TotalPrice: el('pf_total').value||0 };
  
  const btn = el('btnSaveOrder'); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  try { await gas('saveOrder', data, State.user); closeModal(); toast('บันทึกสำเร็จ','success'); loadCurrentPage(); } 
  catch(e) { toast(e.message,'error'); btn.disabled = false; btn.innerHTML = 'บันทึกงาน'; }
}

function deleteOrderReq(id) { openModal('ลบออเดอร์', `<div class="text-center text-red-500 py-4"><i class="fa-solid fa-triangle-exclamation text-5xl mb-4"></i><p>ยืนยันการลบออเดอร์นี้?</p></div>`, `<button onclick="closeModal()" class="btn btn-secondary">ยกเลิก</button><button onclick="gas('deleteOrder','${id}', State.user).then(function(){closeModal();toast('ลบแล้ว','success');loadCurrentPage();})" class="btn bg-red-600 text-white px-6">ลบข้อมูล</button>`); }

// ================= แดชบอร์ด (งานวันนี้) =================
async function render_dashboard() {
  try {
    const d = await gas('getDashboardData', State.user.UserID, State.user.Role); State.cache.orders = d.orders; const s = d.summary;

    let html = `
      <div class="bg-gradient-to-br from-orange-500 to-red-500 rounded-3xl p-6 mb-6 text-white shadow-lg relative overflow-hidden">
        <i class="fa-solid fa-motorcycle text-8xl absolute -right-4 -bottom-4 opacity-10"></i>
        <p class="text-sm font-medium opacity-80">ยอดเงินค่ารอบวันนี้</p>
        <h2 class="text-5xl font-black mt-1 mb-4">฿${s.todayIncome}</h2>
        <div class="flex gap-4 border-t border-white/20 pt-4">
          <div><p class="text-[10px] opacity-70 uppercase">งานวันนี้</p><p class="font-bold text-lg">${s.todayOrders} งาน</p></div>
          <div class="border-l border-white/20 pl-4"><p class="text-[10px] opacity-70 uppercase">เดือนนี้</p><p class="font-bold text-lg">฿${s.monthIncome}</p></div>
        </div>
      </div>
      
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-slate-700 text-sm"><i class="fa-regular fa-clock text-main mr-1"></i> ออเดอร์ล่าสุดวันนี้</h3>
        <button onclick="navigate('orders')" class="text-xs font-bold text-slate-400 hover:text-main">ดูทั้งหมด ></button>
      </div>
    `;

    const todaysOnly = d.orders.filter(o => String(o.OrderDate).startsWith(new Date().toISOString().substring(0,10)));

    if(todaysOnly.length === 0) {
      html += `<div class="bg-white rounded-2xl shadow-sm border border-dashed p-10 text-center text-slate-400"><i class="fa-solid fa-mug-hot text-5xl mb-3 opacity-50"></i><p class="text-sm mt-2">ยังไม่มีงานในวันนี้<br>เริ่มรับออเดอร์แรกกันเลย!</p></div>`;
    } else {
      html += `<div class="space-y-3">`;
      todaysOnly.slice(0,10).forEach(o => {
        let isPaid = o.Status === 'จ่ายแล้ว';
        html += `
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center active:scale-95 transition ${isPaid?'opacity-60':''}">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center font-bold border border-orange-100"><i class="fa-solid fa-box"></i></div>
            <div>
              <p class="font-bold text-slate-800 text-sm">${o.OrderRef}</p>
              <p class="text-[10px] text-slate-500 mt-0.5"><i class="fa-solid fa-route opacity-50"></i> ${o.DistanceKM} กม.</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <p class="font-black text-emerald-500 text-lg">+฿${o.FeeTHB}</p>
              ${isPaid ? `<p class="text-[8px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded uppercase">จ่ายแล้ว</p>` : ''}
            </div>
            ${!isPaid ? `
            <div class="border-l border-slate-100 pl-3 flex flex-col gap-1.5">
              <button onclick="openOrderForm('${o.OrderID}')" class="text-slate-400 hover:text-blue-500"><i class="fa-solid fa-pen text-xs"></i></button>
              <button onclick="deleteOrderReq('${o.OrderID}')" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>` : ''}
          </div>
        </div>`;
      });
      html += `</div>`;
    }
    el('content').innerHTML = html;
  } catch(e) { el('content').innerHTML = errorHtml(e); }
}

// ================= ประวัติงานทั้งหมด =================
async function render_orders() {
  try {
    const d = await gas('getDashboardData', State.user.UserID, State.user.Role); State.cache.orders = d.orders;
    
    el('content').innerHTML = `
      <div class="bg-white p-3 rounded-2xl shadow-sm border mb-4 flex gap-2">
        <div class="relative flex-1"><i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i><input id="searchOrder" placeholder="ค้นหาเลขออเดอร์..." class="input pl-10 bg-slate-50 border-none" oninput="renderOrderList()" /></div>
      </div>
      <div id="orderList" class="space-y-3 pb-4"></div>`; 

    window.renderOrderList = function() {
      const q = el('searchOrder').value.toLowerCase(); 
      const filtered = State.cache.orders.filter(r => !q || String(r.OrderRef).toLowerCase().includes(q));

      el('orderList').innerHTML = filtered.map(o => {
        let isPaid = o.Status === 'จ่ายแล้ว';
        let badge = isPaid ? `<span class="badge-paid text-[9px] px-1.5 py-0.5 font-bold">จ่ายแล้ว</span>` : `<span class="badge-pending text-[9px] px-1.5 py-0.5 font-bold">รอจ่าย</span>`;
        return `
        <div class="bg-white p-4 rounded-2xl border shadow-sm ${isPaid?'opacity-60':''}">
          <div class="flex justify-between items-start mb-2 border-b border-slate-50 pb-2">
            <div class="flex items-center gap-2"><span class="bg-slate-800 text-white text-[10px] px-2 py-0.5 rounded-md font-mono">${String(o.OrderDate).substring(0,10)}</span> ${State.user.Role==='admin'?`<span class="text-[10px] text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded"><i class="fa-solid fa-motorcycle"></i> ${o.DriverName}</span>`:''}</div>
            <p class="font-black text-main text-lg border border-orange-100 bg-orange-50 px-2 py-0.5 rounded-xl">฿${o.FeeTHB}</p>
          </div>
          <div class="flex justify-between items-end mt-2">
            <div>
              <div class="flex items-center gap-2 mb-0.5"><p class="font-bold text-slate-800 text-base">${o.OrderRef}</p> ${badge}</div>
              <p class="text-[11px] text-slate-500"><i class="fa-solid fa-route opacity-50 w-3"></i> ${o.DistanceKM} กม. | 👤 ${o.CustomerName||'-'}</p>
            </div>
            ${!isPaid || State.user.Role === 'admin' ? `
            <div class="flex gap-2">
              ${!isPaid ? `<button onclick="openOrderForm('${o.OrderID}')" class="w-8 h-8 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center active:scale-90"><i class="fa-solid fa-pen text-xs"></i></button>` : ''}
              <button onclick="deleteOrderReq('${o.OrderID}')" class="w-8 h-8 bg-red-50 text-red-600 rounded-full flex items-center justify-center active:scale-90"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>` : ''}
          </div>
        </div>`;
      }).join('') || `<div class="p-10 text-center text-slate-400 bg-white border border-dashed rounded-2xl"><i class="fa-solid fa-folder-open text-4xl mb-2 opacity-50"></i><p>ไม่พบประวัติงาน</p></div>`;
    }; 
    window.renderOrderList();
  } catch(e) { el('content').innerHTML = errorHtml(e); }
}

// ================= หน้าสรุปรายงาน และเบิกจ่าย =================
async function render_report() {
  el('content').innerHTML = `
    <div class="bg-white rounded-2xl shadow-sm border p-4 md:p-5 mb-4">
      <h3 class="font-bold text-slate-700 text-sm mb-3"><i class="fa-solid fa-filter text-main mr-1"></i> ตัวกรองรอบบิล</h3>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><label class="text-[10px] font-bold text-slate-500 ml-1">ปี</label><select id="r_year" class="input bg-slate-50 py-1.5 text-xs border-none font-bold"></select></div>
        <div><label class="text-[10px] font-bold text-slate-500 ml-1">เดือน</label><select id="r_month" class="input bg-slate-50 py-1.5 text-xs border-none font-bold"></select></div>
        <div class="col-span-2"><label class="text-[10px] font-bold text-slate-500 ml-1">รอบวันที่ (Period)</label><select id="r_period" class="input bg-blue-50 py-1.5 text-sm font-bold text-blue-600 border-none"><option value="1">ครึ่งเดือนแรก (วันที่ 1 - 14)</option><option value="2">ครึ่งเดือนหลัง (วันที่ 15 - สิ้นเดือน)</option></select></div>
        ${State.user.Role === 'admin' ? `<div class="col-span-2"><label class="text-[10px] font-bold text-slate-500 ml-1">ไรเดอร์</label><select id="r_driver" class="input bg-slate-50 py-1.5 text-sm border-none"><option value="ALL">รวมทุกคน</option></select></div>` : `<input type="hidden" id="r_driver" value="${State.user.FullName}">`}
      </div>
      <button onclick="fetchReport()" class="btn bg-slate-800 hover:bg-slate-700 active:scale-95 text-white w-full py-3 shadow-md rounded-xl"><i class="fa-solid fa-file-invoice mr-2"></i> ดึงข้อมูลรีพอร์ต</button>
    </div>
    <div id="reportContainer"></div>
  `;
  
  const d = new Date();
  const ys = el('r_year'); for(let y=2024; y<=2030; y++) ys.add(new Option(y, y)); ys.value = d.getFullYear();
  const ms = el('r_month'); const mNames = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  for(let m=1; m<=12; m++) ms.add(new Option(mNames[m-1], m)); ms.value = d.getMonth()+1;
  el('r_period').value = d.getDate() <= 14 ? "1" : "2";

  if(State.user.Role === 'admin') {
    gas('getUsers').then(users => {
      const ds = el('r_driver'); users.forEach(u => { if(u.Role !== 'admin') ds.add(new Option(u.FullName, u.FullName)); });
    });
  }
}

window.fetchReport = async function() {
  const y = parseInt(el('r_year').value); const m = parseInt(el('r_month').value); const p = el('r_period').value; const drv = el('r_driver').value;
  el('reportContainer').innerHTML = `<div class="text-center py-10 text-main"><i class="fa-solid fa-spinner fa-spin text-3xl"></i></div>`;
  
  try {
    const res = await gas('getSummaryReport', y, m, p, drv, State.user.UserID, State.user.Role);
    let html = `
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-5 mb-4 text-white shadow-md relative overflow-hidden">
        <i class="fa-solid fa-coins absolute -right-2 -bottom-2 text-7xl opacity-20"></i>
        <p class="text-[10px] font-bold opacity-80 mb-1 uppercase tracking-wider">สรุปรวมค่ารอบ (Period ${p})</p>
        <div class="flex justify-between items-end relative z-10">
          <h2 class="text-4xl font-black">฿${res.totalFee}</h2>
          <div class="text-right bg-white/20 px-3 py-1.5 rounded-xl backdrop-blur-sm"><p class="text-[9px] opacity-80 uppercase font-bold">จำนวนงาน</p><p class="font-bold text-xl leading-none">${res.totalJobs}</p></div>
        </div>
      </div>`;
    
    if(State.user.Role === 'admin' && drv === 'ALL') {
      html += `<div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-4"><table class="w-full text-sm text-left"><thead class="bg-slate-50 border-b"><tr><th class="p-3 font-bold text-slate-500">ไรเดอร์</th><th class="p-3 text-center font-bold text-slate-500">งาน</th><th class="p-3 text-right font-bold text-slate-500">ยอดเงิน</th></tr></thead><tbody class="divide-y">`;
      for(let k in res.summary) { html += `<tr><td class="p-3 font-bold text-slate-700">${k}</td><td class="p-3 text-center"><span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md text-xs font-bold">${res.summary[k].jobs}</span></td><td class="p-3 text-right font-black text-emerald-600">฿${res.summary[k].amount}</td></tr>`; }
      html += `</tbody></table></div>`;
    }

    if(State.user.Role === 'admin') {
      html += `<button onclick="approveSettle()" class="btn w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white py-3.5 shadow-lg shadow-emerald-500/30 rounded-xl mb-6 text-base"><i class="fa-solid fa-check-double mr-2"></i> อนุมัติเบิกจ่ายรอบนี้</button>`;
    }

    html += `<h4 class="font-bold text-sm text-slate-700 mb-2"><i class="fa-solid fa-list-ol text-slate-400 mr-1"></i> รายการวิ่งงาน</h4><div class="space-y-2">`;
    if(res.details.length === 0) html += `<div class="p-6 text-center text-slate-400 border border-dashed rounded-xl bg-white text-xs">ไม่พบข้อมูลในรอบบิลนี้</div>`;
    res.details.forEach(o => {
      let isPaid = o.Status === 'จ่ายแล้ว';
      html += `
        <div class="bg-white p-3 rounded-xl border shadow-sm flex justify-between items-center ${isPaid?'opacity-60 bg-slate-50':''}">
          <div>
            <div class="flex items-center gap-2"><span class="font-bold text-sm text-slate-800">${o.OrderRef}</span> ${isPaid?`<span class="badge-paid text-[8px] px-1.5 py-0.5 rounded font-bold">จ่ายแล้ว</span>`:''}</div>
            <p class="text-[10px] text-slate-500 mt-0.5">${String(o.OrderDate).substring(0,10)} | ${o.DistanceKM} กม.</p>
          </div>
          <div class="font-bold text-emerald-600 text-base">+฿${o.FeeTHB}</div>
        </div>`;
    });
    html += `</div>`;
    el('reportContainer').innerHTML = html;
  } catch(e) { el('reportContainer').innerHTML = errorHtml(e); }
}

window.approveSettle = function() {
  const y = el('r_year').value; const m = el('r_month').value; const p = el('r_period').value; const drv = el('r_driver').value;
  Swal.fire({ title: 'ยืนยันการอนุมัติจ่ายเงิน?', text: "รายการทั้งหมดในรอบนี้จะถูกล็อกสถานะเป็น 'จ่ายแล้ว' และไม่สามารถแก้ไขได้อีก", icon: 'warning', showCancelButton: true, confirmButtonText: 'ยืนยันจ่ายเงิน' }).then(res => {
    if(res.isConfirmed) {
      Swal.showLoading();
      gas('settlePayment', y, m, p, drv, State.user.Role).then(count => {
        Swal.fire('สำเร็จ', `อัปเดตสถานะจ่ายแล้วจำนวน ${count} รายการ`, 'success'); fetchReport();
      }).catch(e => Swal.fire('Error', e.message, 'error'));
    }
  });
}

// ================= จัดการแอดมิน =================
function makePage(opt) { 
  return async function() { 
    try { 
      const list = await gas(opt.fetchFn, {}); State.cache[opt.title] = list; State.cache.gpOpts = opt; 
      el('content').innerHTML = `<div class="bg-white rounded-2xl shadow-sm border p-4 mb-4 flex justify-between"><input id="gpS" placeholder="ค้นหาพนักงาน..." class="input max-w-xs border-none bg-slate-50" oninput="window.renderGPRows()" /><button onclick="openGPForm()" class="btn btn-primary rounded-xl px-4"><i class="fa-solid fa-plus md:mr-1"></i> <span class="hidden md:inline">เพิ่มพนักงาน</span></button></div><div class="bg-white rounded-2xl shadow-sm border overflow-x-auto"><table class="w-full text-sm text-left whitespace-nowrap"><thead class="bg-slate-50 border-b"><tr>${opt.cols.map(c => `<th class="p-4 font-bold text-slate-500">${c.label}</th>`).join('')}<th class="p-4 text-center font-bold text-slate-500">จัดการ</th></tr></thead><tbody id="gpTb" class="divide-y"></tbody></table></div>`; window.renderGPRows(); 
    } catch(e) { el('content').innerHTML = errorHtml(e); } 
  } 
}
window.renderGPRows = function() { 
  const opt = State.cache.gpOpts; const q = el('gpS').value.toLowerCase(); const filtered = (State.cache[opt.title]||[]).filter(r => !q || Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  el('gpTb').innerHTML = filtered.map(r => `<tr class="hover:bg-slate-50">${opt.cols.map(c => `<td class="p-4">${c.fmt ? c.fmt(r[c.key], r) : escapeHtml(r[c.key]||'-')}</td>`).join('')}<td class="p-4 text-center"><button onclick="openGPForm('${r[opt.id]}')" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200"><i class="fa-solid fa-pen text-xs"></i></button> <button onclick="gas('${opt.delFn}','${r[opt.id]}', State.user).then(function(){toast('ลบแล้ว','success');loadCurrentPage()})" class="w-8 h-8 rounded-full bg-red-50 text-red-600 hover:bg-red-100 ml-1"><i class="fa-solid fa-trash text-xs"></i></button></td></tr>`).join('') || `<tr><td colspan="10" class="text-center p-10 text-slate-400">ไม่มีข้อมูล</td></tr>`; 
};

async function openGPForm(id) {
  const opt = State.cache.gpOpts; const data = (State.cache[opt.title]||[]).find(r => r[opt.id] === id) || {};
  const fields = await Promise.all(opt.fields.map(async function(f) { 
    if (f.type === 'select') { const opts = typeof f.opts === 'function' ? await f.opts() : f.opts; return `<div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">${f.label}</label><select id="gpf_${f.key}" class="input bg-slate-50 border-none"><option value="">-- เลือก --</option>${opts.map(o => `<option value="${o.v}" ${data[f.key]==o.v?'selected':''}>${o.l}</option>`).join('')}</select></div>`; } 
    return `<div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">${f.label}</label><input id="gpf_${f.key}" type="${f.type||'text'}" class="input bg-slate-50 border-none" value="${escapeHtml(data[f.key]||'')}"></div>`; 
  }));
  openModal(id ? 'แก้ไขข้อมูลพนักงาน' : 'เพิ่มพนักงานใหม่', `<div class="grid grid-cols-1 gap-4">${fields.join('')}</div>`, `<button onclick="closeModal()" class="btn btn-secondary flex-1 py-3">ยกเลิก</button><button onclick="saveGPForm('${id||''}', this)" class="btn btn-primary px-6 flex-1 py-3">บันทึก</button>`);
}

async function saveGPForm(id, btnElement) { 
  const opt = State.cache.gpOpts; const data = {}; opt.fields.forEach(f => data[f.key] = el('gpf_' + f.key).value); 
  btnElement.disabled = true; btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; 
  try { if (id) { await gas(opt.updFn, id, data, State.user); } else { await gas(opt.addFn, data, State.user); } closeModal(); toast('บันทึกสำเร็จ', 'success'); loadCurrentPage(); } catch(e) { toast(e.message, 'error'); btnElement.disabled = false; btnElement.innerHTML = 'บันทึก'; } 
}

window.render_users = makePage({ title:'Users', id:'UserID', fetchFn:'getUsers', addFn:'addUser', updFn:'updateUser', delFn:'deleteUser', cols:[{key:'EmpID',label:'รหัสพนักงาน',fmt:v=>`<span class="font-mono text-slate-500 font-bold bg-slate-100 px-2 py-0.5 rounded">${v}</span>`},{key:'Username',label:'Username'},{key:'FullName',label:'ชื่อพนักงาน'},{key:'Role',label:'สิทธิ์',fmt:v=>`<span class="badge ${v==='admin'?'bg-red-100 text-red-600':'bg-blue-100 text-blue-600'}">${v}</span>`}], fields:[{key:'EmpID',label:'รหัสพนักงาน (เว้นว่างระบบจะรันให้)'},{key:'Username',label:'Username'},{key:'Password',label:'Password (ถ้าสร้างใหม่)'},{key:'FullName',label:'ชื่อ-นามสกุล'},{key:'Role',label:'สิทธิ์',type:'select',opts:[{v:'admin',l:'ผู้ดูแล (Admin)'},{v:'user',l:'ไรเดอร์'}]},{key:'Status',label:'สถานะ',type:'select',opts:[{v:'active',l:'เปิดใช้งาน'},{v:'inactive',l:'ปิดบัญชี'}]}] });

window.addEventListener('DOMContentLoaded', function() { 
  if(el('loginUser')) { el('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') el('loginPass').focus(); }); el('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }); }
  try { const u = sessionStorage.getItem('user'); if (u) { State.user = JSON.parse(u); initApp(); return; } } catch(e) { sessionStorage.removeItem('user'); }
});
</script>
