<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ระบบจัดการค่ารอบไรเดอร์</title>

  <link rel="manifest" href="./manifest.json">
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }</script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { themeMain: '#ea580c' } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root { --theme-main: #ea580c; } 
    * { font-family:'Kanit', sans-serif; transition: 0.2s; } 
    body { background-color: #f8f9fa; }
    .bg-main { background-color: var(--theme-main); }
    .text-main { color: var(--theme-main); }
    
    .sidebar-link { display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem; border-radius:.5rem; color:rgba(255,255,255,0.7); cursor:pointer; }
    .sidebar-link:hover { background:rgba(255,255,255,0.1); color:#fff; } 
    .sidebar-link.active { background:rgba(255,255,255,0.2); color:#fff; border-left: 4px solid #fff; }
    
    .input { width:100%; padding:.6rem 1rem; border:1px solid #d1d5db; border-radius:.75rem; outline:none; font-size:.875rem; background:#fff; } 
    .input:focus { border-color:var(--theme-main); box-shadow:0 0 0 3px rgba(234, 88, 12, 0.2); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.7rem 1rem; border-radius:.75rem; font-weight:600; cursor:pointer; font-size:.875rem; border:none; }
    .btn-primary { background: linear-gradient(135deg, #ea580c, #f97316); color:#fff; } 
    .btn-primary:active { transform:scale(0.98); }
    .btn-secondary { background:#e5e7eb; color:#374151; }
    
    .badge-paid { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-pending { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-800">

<!-- หน้าต่าง Login -->
<div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-[100]">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md relative text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-main text-white text-4xl mb-4 shadow-lg shadow-orange-500/30"><i class="fa-solid fa-motorcycle"></i></div>
    <h1 class="text-2xl font-bold text-slate-800">Rider Tracking</h1>
    <p class="text-sm text-slate-500 mt-1 mb-2">ระบบบันทึกและคำนวณค่ารอบ</p>
    
    <p class="text-xs font-mono text-slate-400 mt-1">Version: 10.2 (Login Fix)</p>
    <p class="text-xs font-mono text-slate-500 mt-0.5 font-medium">Dev: Kitti Prapakarn</p>
    
    <div class="space-y-4 mt-6 text-left">
      <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">ชื่อผู้ใช้งาน</label><input id="loginUser" type="text" class="input bg-slate-50" /></div>
      <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">รหัสผ่าน</label><input id="loginPass" type="password" class="input bg-slate-50" /></div>
      
      <!-- ส่วนแสดง Error (เอากลับมาใช้แทนแบบ Popup เพื่อความเสถียร) -->
      <div id="loginError" class="text-sm font-medium text-center hidden p-3 bg-red-50 text-red-600 rounded-xl border border-red-200"></div>

      <button id="btnLogin" onclick="doLogin()" class="btn btn-primary w-full py-3 text-base mt-2 shadow-md">เข้าสู่ระบบ</button>
      <button id="btnInstallPwa" onclick="handleInstallPwa()" class="btn btn-secondary w-full py-2.5 mt-2 bg-slate-100 text-slate-600 border border-slate-200"><i class="fa-solid fa-download mr-2"></i> ติดตั้งแอปลงมือถือ</button>
    </div>
  </div>
</div>

<!-- โครงสร้างหลักแอป -->
<div id="app" class="hidden h-[100dvh] w-full flex flex-col relative pb-16">
  
  <header class="bg-white border-b px-5 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <h1 id="pageTitle" class="text-xl font-bold text-slate-800 tracking-wide">หน้าแรก</h1>
    <button onclick="loadCurrentPage()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 active:scale-95"><i class="fa-solid fa-arrows-rotate"></i></button>
  </header>

  <main id="content" class="flex-1 overflow-y-auto p-4 md:p-6 pb-28 w-full max-w-3xl mx-auto"></main>

  <nav class="fixed bottom-0 left-0 w-full bg-white border-t flex justify-around items-center z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] pb-safe pt-2 px-2">
    <button onclick="navigate('dashboard')" class="nav-btn flex flex-col items-center text-main w-[20%]" data-page="dashboard"><i class="fa-solid fa-pen-to-square text-xl mb-1"></i><span class="text-[9px] font-medium">หน้าแรก</span></button>
    <button onclick="navigate('orders')" class="nav-btn flex flex-col items-center text-slate-400 w-[20%]" data-page="orders"><i class="fa-solid fa-list text-xl mb-1"></i><span class="text-[9px] font-medium">ประวัติงาน</span></button>
    <div class="w-[20%] flex justify-center -mt-8 relative z-10"><button onclick="openOrderForm()" class="bg-main text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-orange-500/40 hover:scale-105 active:scale-95 border-4 border-white"><i class="fa-solid fa-plus text-2xl"></i></button></div>
    <button onclick="navigate('report')" class="nav-btn flex flex-col items-center text-slate-400 w-[20%]" data-page="report"><i class="fa-solid fa-file-invoice-dollar text-xl mb-1"></i><span class="text-[9px] font-medium">รอบบิล</span></button>
    <button onclick="openMyProfile()" class="nav-btn flex flex-col items-center text-slate-400 w-[20%]"><i class="fa-solid fa-circle-user text-xl mb-1"></i><span class="text-[9px] font-medium">ฉัน</span></button>
  </nav>
</div>

<!-- Modal Form -->
<div id="modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 pb-safe">
  <div id="modalCard" class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-h-[90vh] flex flex-col mx-auto max-w-lg animate-[slideUp_0.3s_ease-out]">
    <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50 rounded-t-3xl"><h3 id="modalTitle" class="font-bold text-lg text-slate-800">Modal</h3><button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="modalBody" class="p-6 overflow-y-auto flex-1 scrollbar-thin"></div>
    <div id="modalFooter" class="px-6 py-4 border-t bg-white flex justify-end gap-3"></div>
  </div>
</div>

<div id="modalPwa" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm flex flex-col mx-auto animate-[slideUp_0.3s_ease-out]">
    <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50 rounded-t-3xl"><h3 class="font-bold text-lg text-slate-800">📱 วิธีติดตั้งแอป</h3><button onclick="hide('modalPwa')" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="modalPwaBody" class="p-6"></div>
    <div class="px-6 py-4 border-t bg-white"><button onclick="hide('modalPwa')" class="btn btn-primary w-full py-3">เข้าใจแล้ว</button></div>
  </div>
</div>

<div id="toast" class="hidden fixed top-6 right-6 z-[80] text-white px-5 py-4 rounded-xl shadow-2xl flex items-center gap-3 transition-opacity"></div>

<script>
// ==============================================================================
// 🚨 วาง URL ของ Google Apps Script ที่ Deploy เสร็จแล้ว มาวางในนี้ 🚨
// ==============================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyYz2bzKVGmShQMCgwHlbJfj_0spCFBwqrCiFYti349-fmN8_Kr77wCBJai7GT6vlbl/exec"; 

function gas(fn, ...args) {
  return new Promise(async function(resolve, reject) {
    try {
      const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args }) });
      const res = await response.json();
      if (res.status === 'success') { resolve(res.data); } else { reject(new Error(res.message)); }
    } catch (err) { reject(err); }
  });
}

const State = { user: null, currentPage: 'dashboard', cache: {} };
let deferredPrompt;

function el(id) { return document.getElementById(id); } 
function show(id) { if(el(id)) el(id).classList.remove('hidden'); } 
function hide(id) { if(el(id)) el(id).classList.add('hidden'); }

window.addEventListener('beforeinstallprompt', function(e) { 
  e.preventDefault(); deferredPrompt = e; 
  if(el('btnInstallPwa')){ el('btnInstallPwa').innerHTML = '<i class="fa-solid fa-download mr-2"></i> ติดตั้งแอปลงมือถือทันที'; el('btnInstallPwa').classList.replace('btn-secondary', 'btn-primary'); } 
});

function handleInstallPwa() {
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(c) { if (c.outcome === 'accepted') { toast('กำลังติดตั้งแอป...', 'success'); } deferredPrompt = null; }); } 
  else { 
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || navigator.vendor || window.opera) && !window.MSStream;
    let instructionHtml = isIOS ? `<div class='bg-blue-50 p-4 rounded-xl border border-blue-100 text-left'><p class='font-bold text-blue-700 mb-2'><i class='fa-brands fa-apple text-xl mr-1'></i> สำหรับ iPhone (Safari)</p><ol class='list-decimal pl-5 space-y-1 text-slate-700'><li>กดปุ่ม <b>แชร์ (Share)</b> ตรงแถบด้านล่าง</li><li>เลื่อนหาคำว่า <b>เพิ่มไปยังหน้าจอโฮม</b></li></ol></div>` : `<div class='bg-green-50 p-4 rounded-xl border border-green-100 text-left'><p class='font-bold text-green-700 mb-2'><i class='fa-brands fa-android text-xl mr-1'></i> สำหรับ Android (Chrome)</p><ol class='list-decimal pl-5 space-y-1 text-slate-700'><li>กดปุ่ม <b>เมนูจุด 3 จุด</b> มุมขวาบน</li><li>เลือก <b>เพิ่มลงในหน้าจอหลัก</b></li></ol></div>`;
    el('modalPwaBody').innerHTML = `<div class='space-y-4 text-sm text-center'><p class='font-bold text-base text-slate-800'>สร้างคีย์ลัดไว้ที่หน้าจอมือถือ</p>${instructionHtml}</div>`; show('modalPwa');
  }
}

function toast(msg, type) { 
  const t = el('toast'); t.className = "fixed bottom-6 right-6 md:top-6 md:bottom-auto z-[80] text-white px-5 py-4 rounded-xl shadow-2xl flex items-center gap-3 text-sm "; 
  t.className += (type === 'error' ? 'bg-red-600' : 'bg-emerald-500');
  t.innerHTML = "<i class='fa-solid " + (type === 'error' ? 'fa-circle-xmark' : 'fa-circle-check') + " text-xl'></i> <span class='font-medium'>" + msg + "</span>"; 
  show('toast'); setTimeout(function() { hide('toast'); }, 3000); 
}

function openModal(title, body, footer) { el('modalTitle').textContent = title; el('modalBody').innerHTML = body; el('modalFooter').innerHTML = footer; show('modal'); }
function closeModal() { hide('modal'); } 
function escapeHtml(text) { return String(text || '').replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'}[c]; }); }
function errorHtml(error) { return "<div class='bg-white p-8 rounded-2xl text-center text-red-500 border'><i class='fa-solid fa-triangle-exclamation text-4xl mb-4 opacity-70'></i><p>" + escapeHtml(error.message || error) + "</p></div>"; }

/* ========================================================
   ระบบ Login (แก้ไขเพิ่ม Error Box ให้เสถียร 100%)
   ======================================================== */
function doLogin() {
  const btn = el('btnLogin'); const err = el('loginError');
  const user = el('loginUser').value.trim(); const pass = el('loginPass').value.trim();
  
  if (!user || !pass) { 
    err.innerHTML = '⚠️ กรุณากรอกข้อมูลให้ครบถ้วน'; 
    show('loginError'); 
    return; 
  }
  
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังตรวจสอบ...'; hide('loginError');

  gas('login', user, pass).then(res => {
    if (res.ok) { 
      State.user = res.user; sessionStorage.setItem('user', JSON.stringify(res.user)); initApp(); 
    } else { 
      err.innerHTML = '❌ ' + res.message; show('loginError'); btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ'; 
    }
  }).catch(e => { 
    err.innerHTML = `<b>❌ เกิดข้อผิดพลาดในการเชื่อมต่อ!</b><br>${e.message}<br><span class='text-xs mt-2 block text-red-500 font-bold'>* โปรดตรวจสอบว่าใส่ลิงก์ API_URL ถูกต้อง (ต้องมีเครื่องหมาย " " ครอบไว้)</span>`; 
    show('loginError'); btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ'; 
  });
}
function logout() { sessionStorage.removeItem('user'); window.location.reload(); }

function initApp() { hide('loginScreen'); show('app'); navigate('dashboard'); }

const PAGE_INFO = { dashboard:'งานของฉันวันนี้', orders:'ประวัติงานทั้งหมด', report:'สรุปบิลและเบิกจ่าย', users:'จัดการพนักงาน' };

function navigate(page) {
  State.currentPage = page; 
  document.querySelectorAll('.nav-btn').forEach(l => { 
    if(l.dataset.page === page) { l.classList.add('text-main'); l.classList.remove('text-slate-400'); } 
    else { l.classList.remove('text-main'); l.classList.add('text-slate-400'); }
  });
  el('pageTitle').textContent = PAGE_INFO[page]; 
  loadCurrentPage();
}

function loadCurrentPage() { 
  el('content').innerHTML = `<div class='flex justify-center p-10'><i class="fa-solid fa-circle-notch fa-spin text-3xl text-main"></i></div>`; 
  if(window['render_' + State.currentPage]) { window['render_' + State.currentPage](); }
}

async function openMyProfile() {
  el('modalTitle').textContent = "โปรไฟล์ของฉัน"; el('modalBody').innerHTML = "<div class='flex justify-center py-10'><i class='fa-solid fa-spinner fa-spin text-2xl'></i></div>"; el('modalFooter').innerHTML = "<button onclick='closeModal()' class='btn btn-secondary mr-auto'>ปิด</button>"; show('modal');
  let profileHtml = `
    <div class="text-center mb-4"><div class="w-20 h-20 bg-orange-100 text-orange-600 rounded-full mx-auto flex items-center justify-center text-4xl mb-3 border-4 border-orange-200"><i class="fa-solid fa-user-ninja"></i></div><h3 class="font-bold text-lg">${State.user.FullName}</h3><p class="text-xs text-slate-500 uppercase">${State.user.Role}</p></div>
    <div class="space-y-3 text-left">
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">รหัสพนักงาน</label><input class="input bg-slate-100" value="${State.user.EmpID||'-'}" disabled></div>
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">ชื่อ-นามสกุล <span class="text-red-500">*</span></label><input id="mp_name" class="input" value="${escapeHtml(State.user.FullName)}"></div>
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">เปลี่ยนรหัสผ่าน (เว้นว่างถ้าไม่เปลี่ยน)</label><input id="mp_pass" type="password" class="input" placeholder="รหัสผ่านใหม่..."></div>
      ${State.user.Role === 'admin' ? `<button onclick="closeModal();navigate('users')" class="w-full mt-2 py-3 bg-slate-800 text-white rounded-xl font-bold shadow-md active:scale-95"><i class="fa-solid fa-users-gear mr-2"></i> จัดการข้อมูลพนักงาน</button>` : ''}
    </div>`;
  el('modalBody').innerHTML = profileHtml; el('modalFooter').innerHTML = "<button onclick='closeModal()' class='btn btn-secondary mr-auto'>ยกเลิก</button><button id='btnSaveMyProf' onclick='saveMyProfile()' class='btn btn-primary px-6'>อัปเดตข้อมูล</button>";
}

async function saveMyProfile() {
  const data = { UserID: State.user.UserID, FullName: el('mp_name').value };
  const pass = el('mp_pass').value.trim(); if (pass) data.Password = pass;
  if (!data.FullName) return toast('กรุณาใส่ชื่อของคุณ', 'warning');
  const btn = el('btnSaveMyProf'); btn.disabled = true; btn.innerHTML = 'กำลังบันทึก...';
  try { await gas('updateMyProfile', data); State.user.FullName = data.FullName; sessionStorage.setItem('user', JSON.stringify(State.user)); closeModal(); toast('อัปเดตข้อมูลแล้ว', 'success'); } catch(e) { toast(e.message, 'error'); btn.disabled = false; btn.innerHTML = 'อัปเดตโปรไฟล์'; }
}

window.calcFeeUI = function() {
  const distInput = parseFloat(el('pf_distance').value) || 0;
  const unit = el('pf_unit').value;
  let distanceMeters = unit === 'km' ? distInput * 1000 : distInput;
  let fee = 0;
  if (distanceMeters > 0) {
    if (distanceMeters <= 300) fee = 5;
    else if (distanceMeters <= 500) fee = 10;
    else if (distanceMeters <= 3000) fee = 15;
    else fee = 25;
  }
  el('pf_fee_disp').textContent = fee; el('pf_fee').value = fee; el('pf_dist_km').value = (distanceMeters/1000).toFixed(2);
}

function openOrderForm(id = null) {
  let d = { OrderID:'', OrderRef:'', CustomerName:'', DistanceKM:'', FeeTHB:0, PaymentMethod:'เงินสด', TotalPrice:'' };
  if(id && State.cache.todayOrders) { const f = State.cache.todayOrders.find(o => o.OrderID === id); if(f) d = f; }
  
  let prefix = 'CPTH'; let num = '';
  if (d.OrderRef.startsWith('AMTH')) { prefix = 'AMTH'; num = d.OrderRef.replace('AMTH',''); }
  else if (d.OrderRef.startsWith('CPTH')) { prefix = 'CPTH'; num = d.OrderRef.replace('CPTH',''); }
  else { num = d.OrderRef; }

  const today = new Date().toISOString().substring(0,10);

  const html = `
    <div class="space-y-4">
      <input type="hidden" id="f_id" value="${d.OrderID}"><input type="hidden" id="f_fee" value="${d.FeeTHB}"><input type="hidden" id="f_date" value="${today}">
      <div class="bg-gradient-to-r from-blue-600 to-cyan-500 rounded-2xl p-4 text-white text-center shadow-lg mb-6"><p class="text-xs font-medium opacity-80 uppercase">ค่ารอบจัดส่ง (บาท)</p><div class="text-5xl font-black mt-1"><span id="f_fee_disp">${d.FeeTHB}</span><span class="text-2xl ml-1">฿</span></div></div>
      <div class="grid grid-cols-1 gap-4">
        <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">📦 เลขออเดอร์ <span class="text-red-500">*</span></label><div class="flex gap-2"><select id="f_prefix" class="input w-1/3 bg-slate-50 font-bold text-center"><option value="CPTH" ${prefix==='CPTH'?'selected':''}>CPTH</option><option value="AMTH" ${prefix==='AMTH'?'selected':''}>AMTH</option></select><input id="f_num" type="number" class="input w-2/3 font-mono text-lg" placeholder="ตัวเลข 4 หลัก" value="${num}"></div></div>
        <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">📍 ระยะทาง (กิโลเมตร) <span class="text-red-500">*</span></label><div class="flex gap-2"><input id="f_distance" type="number" step="0.01" class="input font-bold text-blue-600 text-lg w-2/3" placeholder="เช่น 1.5" value="${d.DistanceKM}" oninput="calcFeeUI()"><select id="pf_unit" class="input w-1/3 bg-slate-50 font-bold" onchange="calcFeeUI()"><option value="km">กิโล (km)</option><option value="m">เมตร (m)</option></select></div><p class="text-[9px] text-slate-400 mt-1.5 ml-1 text-center font-medium bg-slate-100 rounded-lg py-1">0-300m = 5฿ | 301-500m = 10฿ | 501-3km = 15฿ | >3km = 25฿</p></div>
        <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">👤 ชื่อลูกค้า</label><input id="f_cust" type="text" class="input" placeholder="ระบุชื่อลูกค้า (ถ้ามี)" value="${d.CustomerName}"></div>

function submitOrder() {
  const num = el('f_num').value.trim(); const dist = el('f_distance').value;
  if(!num || !dist) return Swal.fire('แจ้งเตือน', 'กรุณาใส่เลขออเดอร์และระยะทางให้ครบ', 'warning');
  
  const finalRef = el('f_prefix').value + num;
  const data = { OrderID: el('f_id').value, OrderDate: el('f_date').value, OrderRef: finalRef, CustomerName: el('f_cust').value, DistanceKM: dist, FeeTHB: el('f_fee').value, TotalPrice: el('f_total').value||0, PaymentMethod: el('f_pay').value };
  
  el('btnSave').disabled = true; el('btnSave').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  gas('saveOrder', data, State.user).then(res => { closeModal(); Swal.fire('สำเร็จ', res, 'success'); loadCurrentPage(); }).catch(e => { Swal.fire('Error', e.message, 'error'); el('btnSave').disabled = false; el('btnSave').innerHTML = 'บันทึกข้อมูล'; });
}

function deleteOrderReq(id) {
  Swal.fire({ title: 'ยืนยันลบข้อมูล?', text: "ไม่สามารถกู้คืนได้", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33' }).then(res => {

window.fetchReport = async function() {

    let html = `<div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-5 mb-4 text-white shadow-md relative overflow-hidden"><i class="fa-solid fa-coins absolute -right-2 -bottom-2 text-7xl opacity-20"></i><p class="text-[10px] font-bold opacity-80 mb-1 uppercase tracking-wider">สรุปรวมค่ารอบ (Period ${p})</p><div class="flex justify-between items-end relative z-10"><h2 class="text-4xl font-black">฿${res.totalFee}</h2><div class="text-right bg-white/20 px-3 py-1.5 rounded-xl backdrop-blur-sm"><p class="text-[9px] opacity-80 uppercase font-bold">จำนวนงาน</p><p class="font-bold text-xl leading-none">${res.totalJobs}</p></div></div></div>`;

      for(let k in res.summary) { html += `<tr><td class="p-3 font-bold text-slate-700">${k}</td><td class="p-3 text-center"><span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md text-xs font-bold">${res.summary[k].jobs}</span></td><td class="p-3 text-right font-black text-emerald-600">฿${res.summary[k].amount}</td></tr>`; }
      html += `</tbody></table></div>`;
    }

    if(State.user.Role === 'admin') { html += `<button onclick="approveSettle()" class="btn w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white py-3.5 shadow-lg shadow-emerald-500/30 rounded-xl mb-6 text-base"><i class="fa-solid fa-check-double mr-2"></i> อนุมัติเบิกจ่ายรอบนี้</button>`; }

    html += `<h4 class="font-bold text-sm text-slate-700 mb-2"><i class="fa-solid fa-list-ol text-slate-400 mr-1"></i> รายการวิ่งงาน</h4><div class="space-y-2">`;
    if(res.details.length === 0) html += `<div class="p-6 text-center text-slate-400 border border-dashed rounded-xl bg-white text-xs">ไม่พบข้อมูลในรอบบิลนี้</div>`;
    res.details.forEach(o => {
      let isPaid = o.Status === 'จ่ายแล้ว';
      html += `<div class="bg-white p-3 rounded-xl border shadow-sm flex justify-between items-center ${isPaid?'opacity-60 bg-slate-50':''}"><div class="flex-1 min-w-0 pr-2"><div class="flex items-center gap-2 mb-0.5"><span class="font-bold text-sm text-slate-800">${o.OrderRef}</span> ${isPaid?`<span class="badge-paid text-[8px] px-1.5 py-0.5 rounded font-bold">จ่ายแล้ว</span>`:''}</div><p class="text-[10px] text-slate-500 truncate">${o.OrderDate.substring(0,10)} | ${o.DistanceKM} กม.</p></div><div class="font-bold text-emerald-600 text-base whitespace-nowrap">+฿${o.FeeTHB}</div></div>`;
    });
    html += `</div>`; el('reportContainer').innerHTML = html;
  } catch(e) { el('reportContainer').innerHTML = errorHtml(e); }

window.approveSettle = function() {
  const y = el('r_year').value; const m = el('r_month').value; const p = el('r_period').value; const drv = el('r_driver').value;
  Swal.fire({ title: 'ยืนยันการอนุมัติจ่ายเงิน?', text: "รายการจะถูกล็อกสถานะเป็น 'จ่ายแล้ว'", icon: 'warning', showCancelButton: true, confirmButtonText: 'ยืนยันจ่ายเงิน' }).then(res => {

async function openGPForm(id) {
  const opt = State.cache.gpOpts; const data = (State.cache[opt.title]||[]).find(r => r[opt.id] === id) || {};
  const fields = await Promise.all(opt.fields.map(async function(f) { 
    if (f.type === 'select') { const opts = typeof f.opts === 'function' ? await f.opts() : f.opts; return `<div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">${f.label}</label><select id="gpf_${f.key}" class="input bg-slate-50 border-none"><option value="">-- เลือก --</option>${opts.map(o => `<option value="${o.v}" ${data[f.key]==o.v?'selected':''}>${o.l}</option>`).join('')}</select></div>`; } 
    return `<div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">${f.label}</label><input id="gpf_${f.key}" type="${f.type||'text'}" class="input bg-slate-50 border-none" value="${escapeHtml(data[f.key]||'')}"></div>`; 
  }));
  openModal(id ? 'แก้ไขข้อมูลพนักงาน' : 'เพิ่มพนักงานใหม่', `<div class="grid grid-cols-1 gap-4">${fields.join('')}</div>`, `<button onclick="closeModal()" class="btn btn-secondary flex-1 py-3">ยกเลิก</button><button onclick="saveGPForm('${id||''}', this)" class="btn btn-primary px-6 flex-1 py-3">บันทึก</button>`);
}

async function saveGPForm(id, btnElement) { 
  const opt = State.cache.gpOpts; const data = {}; opt.fields.forEach(f => data[f.key] = el('gpf_' + f.key).value); 
  btnElement.disabled = true; btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; 
  try { if (id) { await gas(opt.updFn, id, data, State.user); } else { await gas(opt.addFn, data, State.user); } closeModal(); toast('บันทึกสำเร็จ', 'success'); loadCurrentPage(); } catch(e) { toast(e.message, 'error'); btnElement.disabled = false; btnElement.innerHTML = 'บันทึก'; } 
}

window.render_users = makePage({ title:'Users', id:'UserID', fetchFn:'getUsers', addFn:'addUser', updFn:'updateUser', delFn:'deleteUser', cols:[{key:'EmpID',label:'รหัส',fmt:v=>`<span class="font-mono text-slate-500 font-bold bg-slate-100 px-2 py-0.5 rounded">${v}</span>`},{key:'Username',label:'Username'},{key:'FullName',label:'ชื่อพนักงาน'},{key:'Role',label:'สิทธิ์',fmt:v=>`<span class="badge ${v==='admin'?'bg-red-100 text-red-600':'bg-blue-100 text-blue-600'}">${v}</span>`}], fields:[{key:'EmpID',label:'รหัสพนักงาน (เว้นว่างระบบจะรันให้)'},{key:'Username',label:'Username'},{key:'Password',label:'Password (ถ้าสร้างใหม่)'},{key:'FullName',label:'ชื่อ-นามสกุล'},{key:'Role',label:'สิทธิ์',type:'select',opts:[{v:'admin',l:'ผู้ดูแล (Admin)'},{v:'user',l:'ไรเดอร์'}]},{key:'Status',label:'สถานะ',type:'select',opts:[{v:'active',l:'เปิดใช้งาน'},{v:'inactive',l:'ปิดบัญชี'}]}] });

window.addEventListener('DOMContentLoaded', function() { 
  if(el('loginUser')) { el('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') el('loginPass').focus(); }); el('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }); }
  try { const u = sessionStorage.getItem('user'); if (u) { State.user = JSON.parse(u); initApp(); return; } } catch(e) { sessionStorage.removeItem('user'); }
});
</script>
