<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ระบบจัดการค่ารอบไรเดอร์</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }</script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { themeMain: '#ea580c' } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root { --theme-main: #ea580c; } 
    * { font-family:'Kanit', sans-serif; transition: 0.2s; } 
    body { background-color: #f8f9fa; }
    .bg-main { background-color: var(--theme-main); }
    .text-main { color: var(--theme-main); }
    
    .sidebar-link { display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem; border-radius:.5rem; color:rgba(255,255,255,0.7); cursor:pointer; }
    .sidebar-link:hover { background:rgba(255,255,255,0.1); color:#fff; } 
    .sidebar-link.active { background:rgba(255,255,255,0.2); color:#fff; border-left: 4px solid #fff; }
    
    .input { width:100%; padding:.6rem 1rem; border:1px solid #d1d5db; border-radius:.75rem; outline:none; font-size:.875rem; background:#fff; } 
    .input:focus { border-color:var(--theme-main); box-shadow:0 0 0 3px rgba(234, 88, 12, 0.2); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.7rem 1rem; border-radius:.75rem; font-weight:600; cursor:pointer; font-size:.875rem; border:none; }
    .btn-primary { background: linear-gradient(135deg, #ea580c, #f97316); color:#fff; } 
    .btn-primary:active { transform:scale(0.98); }
    .btn-secondary { background:#e5e7eb; color:#374151; }
    
    .badge-paid { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-pending { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-800">

<!-- หน้าต่าง Login -->
<div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-[100]">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md relative text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-main text-white text-4xl mb-4 shadow-lg shadow-orange-500/30"><i class="fa-solid fa-motorcycle"></i></div>
    <h1 class="text-2xl font-bold text-slate-800">Rider Tracking</h1>
    <p class="text-sm text-slate-500 mt-1 mb-2">ระบบบันทึกและคำนวณค่ารอบ</p>
    
    <p class="text-xs font-mono text-slate-400 mt-1">Version: 8.4 (PWA Install)</p>
    <p class="text-xs font-mono text-slate-500 mt-0.5 font-medium">Dev: Kitti Prapakarn</p>
    
    <div class="space-y-4 mt-6 text-left">
      <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">ชื่อผู้ใช้งาน</label><input id="loginUser" type="text" class="input bg-slate-50" /></div>
      <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">รหัสผ่าน</label><input id="loginPass" type="password" class="input bg-slate-50" /></div>
      <button id="btnLogin" onclick="doLogin()" class="btn btn-primary w-full py-3 text-base mt-2 shadow-md">เข้าสู่ระบบ</button>
      
      <!-- ปุ่มติดตั้งแอป PWA -->
      <button id="btnInstallPwa" onclick="handleInstallPwa()" class="btn btn-secondary w-full py-2.5 mt-2 bg-slate-100 text-slate-600 border border-slate-200">
        <i class="fa-solid fa-download mr-2"></i> ติดตั้งแอปลงมือถือ
      </button>
    </div>
  </div>
</div>

<!-- โครงสร้างหลักแอป -->
<div id="app" class="hidden h-[100dvh] w-full flex flex-col relative pb-16">
  
  <header class="bg-white border-b px-5 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <h1 id="pageTitle" class="text-xl font-bold text-slate-800 tracking-wide">หน้าแรก</h1>
    <button onclick="loadCurrentPage()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 active:scale-95"><i class="fa-solid fa-arrows-rotate"></i></button>
  </header>

  <main id="content" class="flex-1 overflow-y-auto p-4 md:p-6 pb-28 w-full max-w-3xl mx-auto"></main>

  <!-- แถบเมนูล่าง 4 ปุ่ม + 1 ปุ่มลอย -->
  <nav class="fixed bottom-0 left-0 w-full bg-white border-t flex justify-around items-center z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] pb-safe pt-2 px-2">
    <button onclick="navigate('dashboard')" class="nav-btn flex flex-col items-center text-main w-[25%]" data-page="dashboard">
      <i class="fa-solid fa-pen-to-square text-xl mb-1"></i><span class="text-[10px] font-medium">บันทึกงาน</span>
    </button>
    
    <!-- ปุ่มเพิ่มงานใหญ่ตรงกลาง -->
    <div class="w-[20%] flex justify-center -mt-8 relative z-10">
      <button onclick="openOrderForm()" class="bg-main text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/40 hover:scale-105 active:scale-95 border-4 border-white">
        <i class="fa-solid fa-plus text-2xl"></i>
      </button>
    </div>

    <button onclick="navigate('report')" class="nav-btn flex flex-col items-center text-slate-400 w-[25%]" data-page="report">
      <i class="fa-solid fa-chart-line text-xl mb-1"></i><span class="text-[10px] font-medium">สรุป/จ่ายเงิน</span>
    </button>
    <button onclick="logout()" class="flex flex-col items-center text-red-400 w-[25%] active:scale-95">
      <i class="fa-solid fa-right-from-bracket text-xl mb-1"></i><span class="text-[10px] font-medium">ออก</span>
    </button>
  </nav>
</div>

<!-- Modal Form -->
<div id="modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] flex items-end justify-center p-0 sm:p-4 pb-safe">
  <div id="modalCard" class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-h-[90vh] flex flex-col mx-auto max-w-lg animate-[slideUp_0.3s_ease-out]">
    <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50 rounded-t-3xl">
      <h3 id="modalTitle" class="font-bold text-lg text-slate-800">Modal</h3>
      <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modalBody" class="p-6 overflow-y-auto flex-1 scrollbar-thin"></div>
    <div id="modalFooter" class="px-6 py-4 border-t bg-white flex justify-end gap-3"></div>
  </div>
</div>

<!-- Modal PWA (สำหรับซ่อน/แสดงหน้าต่างติดตั้ง iOS) -->
<div id="modalPwa" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm flex flex-col mx-auto animate-[slideUp_0.3s_ease-out]">
    <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50 rounded-t-3xl">
      <h3 class="font-bold text-lg text-slate-800">📱 วิธีติดตั้งแอป</h3>
      <button onclick="hide('modalPwa')" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modalPwaBody" class="p-6"></div>
    <div class="px-6 py-4 border-t bg-white"><button onclick="hide('modalPwa')" class="btn btn-primary w-full py-3">เข้าใจแล้ว</button></div>
  </div>
</div>

<div id="toast" class="hidden fixed top-6 right-6 z-[80] text-white px-5 py-4 rounded-xl shadow-2xl flex items-center gap-3 transition-opacity"></div>

<script>
// ==============================================================================
// 🚨 วาง URL ของ Google Apps Script ที่ Deploy เสร็จแล้ว มาวางในนี้ 🚨
// ==============================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyvEUsZ10qx0JG5HdmHY1sqJkRPBpFuHKUPyyvUIN3cIz7ogY-8Kwn-4e637QMirs4w/exec"; 

function gas(fn, ...args) {
  return new Promise(async function(resolve, reject) {
    try {
      const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args }) });
      const res = await response.json();
      if (res.status === 'success') { resolve(res.data); } else { reject(new Error(res.message)); }
    } catch (err) { reject(err); }
  });
}

const State = { user: null, currentPage: 'dashboard' };
let deferredPrompt; // ตัวแปรเก็บเหตุการณ์ติดตั้ง PWA

function el(id) { return document.getElementById(id); } 
function show(id) { if(el(id)) el(id).classList.remove('hidden'); } 
function hide(id) { if(el(id)) el(id).classList.add('hidden'); }

function toast(msg, type) { 
  const t = el('toast'); t.className = "fixed bottom-6 right-6 md:top-6 md:bottom-auto z-[80] text-white px-5 py-4 rounded-xl shadow-2xl flex items-center gap-3 text-sm "; 
  t.className += (type === 'error' ? 'bg-red-600' : 'bg-emerald-500');
  t.innerHTML = "<i class='fa-solid " + (type === 'error' ? 'fa-circle-xmark' : 'fa-circle-check') + " text-xl'></i> <span class='font-medium'>" + msg + "</span>"; 
  show('toast'); setTimeout(function() { hide('toast'); }, 3000); 
}

function openModal(title, body, footer) { el('modalTitle').textContent = title; el('modalBody').innerHTML = body; el('modalFooter').innerHTML = footer; show('modal'); }
function closeModal() { hide('modal'); } 
function escapeHtml(text) { return String(text || '').replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'}[c]; }); }
function errorHtml(error) { return "<div class='bg-white p-8 rounded-2xl text-center text-red-500 border'><i class='fa-solid fa-triangle-exclamation text-4xl mb-4 opacity-70'></i><p>" + escapeHtml(error.message || error) + "</p></div>"; }

/* ========================================================
   ระบบติดตั้ง PWA
   ======================================================== */
window.addEventListener('beforeinstallprompt', function(e) { 
  e.preventDefault(); 
  deferredPrompt = e; 
  if(el('btnInstallPwa')){ 
    el('btnInstallPwa').innerHTML = '<i class="fa-solid fa-download mr-2"></i> ติดตั้งแอปลงมือถือทันที'; 
    el('btnInstallPwa').classList.replace('btn-secondary', 'btn-primary'); 
  } 
});

function handleInstallPwa() {
  if (deferredPrompt) { 
    // ถ้าเครื่อง Android รองรับ จะเด้ง Pop-up ติดตั้งของ Google Chrome ให้เลย
    deferredPrompt.prompt(); 
    deferredPrompt.userChoice.then(function(choiceResult) { 
      if (choiceResult.outcome === 'accepted') { toast('กำลังติดตั้งแอป...', 'success'); } 
      deferredPrompt = null; 
    }); 
  } else { 
    // ถ้าเป็น iOS หรือระบบไม่เด้งให้ จะขึ้นคำอธิบายวิธีการติดตั้ง
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || navigator.vendor || window.opera) && !window.MSStream;
    let instructionHtml = isIOS 
      ? `<div class='bg-blue-50 p-4 rounded-xl border border-blue-100 text-left'><p class='font-bold text-blue-700 mb-2'><i class='fa-brands fa-apple text-xl mr-1'></i> สำหรับ iPhone (Safari)</p><ol class='list-decimal pl-5 space-y-1 text-slate-700'><li>กดปุ่ม <b>แชร์ (Share)</b> ตรงแถบด้านล่าง</li><li>เลื่อนหาและเลือกคำว่า <b>เพิ่มไปยังหน้าจอโฮม</b> (Add to Home Screen)</li></ol></div>` 
      : `<div class='bg-green-50 p-4 rounded-xl border border-green-100 text-left'><p class='font-bold text-green-700 mb-2'><i class='fa-brands fa-android text-xl mr-1'></i> สำหรับ Android (Chrome)</p><ol class='list-decimal pl-5 space-y-1 text-slate-700'><li>กดปุ่ม <b>เมนูจุด 3 จุด</b> มุมขวาบนของเบราว์เซอร์</li><li>เลือกเมนู <b>เพิ่มลงในหน้าจอหลัก</b> (Add to Home screen)</li></ol></div>`;
    
    el('modalPwaBody').innerHTML = `<div class='space-y-4 text-sm text-center'><p class='font-bold text-base text-slate-800'>สร้างคีย์ลัดไว้ที่หน้าจอมือถือเพื่อการใช้งานที่รวดเร็ว</p>${instructionHtml}</div>`;
    show('modalPwa');
  }
}

function doLogin() {
  const btn = el('btnLogin'); const user = el('loginUser').value.trim(); const pass = el('loginPass').value.trim();
  if (!user || !pass) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบ', 'warning');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  gas('login', user, pass).then(res => {
    if (res.ok) { State.user = res.user; sessionStorage.setItem('user', JSON.stringify(res.user)); initApp(); } 
    else { Swal.fire('ผิดพลาด', res.message, 'error'); btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ'; }
  }).catch(e => { Swal.fire('Error', e.message, 'error'); btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ'; });
}
function logout() { sessionStorage.removeItem('user'); window.location.reload(); }

function initApp() {
  hide('loginScreen'); show('app'); navigate('dashboard');
}

const PAGE_INFO = { dashboard:'บันทึกงานวันนี้', report:'สรุปยอดและเบิกจ่าย' };

function navigate(page) {
  State.currentPage = page; 
  document.querySelectorAll('.nav-btn').forEach(l => { 
    if(l.dataset.page === page) { l.classList.add('text-main'); l.classList.remove('text-slate-400'); } 
    else { l.classList.remove('text-main'); l.classList.add('text-slate-400'); }
  });
  el('pageTitle').textContent = PAGE_INFO[page]; 
  loadCurrentPage();
}

function loadCurrentPage() { 
  el('content').innerHTML = `<div class='flex justify-center p-10'><i class="fa-solid fa-circle-notch fa-spin text-3xl text-main"></i></div>`; 
  window['render_' + State.currentPage](); 
}

/* ========================================================
   หน้าบันทึกงาน (Dashboard / Today's Orders)
   ======================================================== */
async function render_dashboard() {
  try {
    const todayStr = new Date().toISOString().substring(0, 10);
    const orders = await gas('getOrdersByDate', todayStr);
    
    const myOrders = State.user.Role === 'admin' ? orders : orders.filter(o => o.DriverName === State.user.FullName);

    let html = `
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-slate-700 text-sm"><i class="fa-solid fa-calendar-day text-main mr-1"></i> ประวัติงานวันนี้</h3>
        <span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-bold">${myOrders.length} ออเดอร์</span>
      </div>
      <div class="space-y-3">
    `;

    if(myOrders.length === 0) {
      html += `<div class="bg-white rounded-2xl shadow-sm border border-dashed p-10 text-center text-slate-400"><i class="fa-solid fa-box-open text-5xl mb-3 opacity-50"></i><p class="text-sm">ยังไม่มีงานในวันนี้<br>กดปุ่ม + ตรงกลางเพื่อเพิ่มงาน</p></div>`;
    } else {
      myOrders.forEach(o => {
        let isPaid = o.Status === 'จ่ายแล้ว';
        let badge = isPaid ? `<span class="badge-paid text-[10px] px-2 py-0.5 rounded-full"><i class="fa-solid fa-check"></i> จ่ายแล้ว</span>` : `<span class="badge-pending text-[10px] px-2 py-0.5 rounded-full"><i class="fa-solid fa-clock"></i> รอดำเนินการ</span>`;
        
        html += `
        <div class="bg-white p-4 rounded-2xl border shadow-sm transition active:scale-95 ${isPaid?'opacity-70':''}">
          <div class="flex justify-between items-start mb-2">
            <div class="flex gap-2 items-center"><span class="font-mono font-bold text-slate-800">${o.OrderRef}</span> ${badge}</div>
            <div class="font-black text-main text-lg">+฿${o.FeeTHB}</div>
          </div>
          <div class="flex justify-between items-end">
            <div class="text-xs text-slate-500">
              <div><i class="fa-solid fa-user text-slate-400 w-4"></i> ${o.CustomerName||'-'}</div>
              <div class="mt-1"><i class="fa-solid fa-route text-slate-400 w-4"></i> ${o.DistanceKM} กม. | 💰 ยอดเก็บ: ฿${o.TotalPrice||0}</div>
              ${State.user.Role==='admin' ? `<div class="mt-1 font-bold text-blue-600"><i class="fa-solid fa-motorcycle w-4"></i> ${o.DriverName}</div>`:''}
            </div>
            ${!isPaid ? `
            <div class="flex gap-2">
              <button onclick="openOrderForm('${o.OrderID}')" class="w-8 h-8 rounded-full bg-yellow-50 text-yellow-600 flex justify-center items-center"><i class="fa-solid fa-pen text-xs"></i></button>
              <button onclick="deleteOrder('${o.OrderID}')" class="w-8 h-8 rounded-full bg-red-50 text-red-600 flex justify-center items-center"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>` : ''}
          </div>
        </div>`;
      });
    }
    html += `</div>`;
    el('content').innerHTML = html;
    State.cache.todayOrders = myOrders;
  } catch(e) { Swal.fire('Error', e.message, 'error'); }
}

window.calcFee = function() {
  const km = parseFloat(el('f_dist').value) || 0;
  let amt = 0;
  if(km > 0 && km <= 0.3) amt = 5;
  else if(km > 0.3 && km <= 0.5) amt = 10;
  else if(km > 0.5 && km <= 3.0) amt = 15;
  else if(km > 3.0) amt = 25;
  
  el('f_fee_disp').textContent = amt;
  el('f_fee').value = amt;
}

function openOrderForm(id = null) {
  let d = { OrderID:'', OrderRef:'', CustomerName:'', DistanceKM:'', FeeTHB:0, PaymentMethod:'เงินสด', TotalPrice:'' };
  if(id && State.cache.todayOrders) {
    const f = State.cache.todayOrders.find(o => o.OrderID === id); if(f) d = f;
  }
  
  let prefix = 'CPTH'; let num = '';
  if (d.OrderRef.startsWith('AMTH')) { prefix = 'AMTH'; num = d.OrderRef.replace('AMTH',''); }
  else if (d.OrderRef.startsWith('CPTH')) { prefix = 'CPTH'; num = d.OrderRef.replace('CPTH',''); }
  else { num = d.OrderRef; }

  const today = new Date().toISOString().substring(0,10);

  const html = `
    <div class="space-y-4">
      <input type="hidden" id="f_id" value="${d.OrderID}">
      <input type="hidden" id="f_fee" value="${d.FeeTHB}">
      <input type="hidden" id="f_date" value="${today}">
      
      <div class="bg-gradient-to-r from-blue-600 to-cyan-500 rounded-2xl p-4 text-white text-center shadow-lg mb-6">
        <p class="text-xs font-medium opacity-80 uppercase">ค่ารอบจัดส่ง (บาท)</p>
        <div class="text-5xl font-black mt-1"><span id="f_fee_disp">${d.FeeTHB}</span><span class="text-2xl ml-1">฿</span></div>
      </div>

      <div class="grid grid-cols-1 gap-4">
        <div>
          <label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">📦 เลขออเดอร์ <span class="text-red-500">*</span></label>
          <div class="flex gap-2">
            <select id="f_prefix" class="input w-1/3 bg-slate-50 font-bold text-center"><option value="CPTH" ${prefix==='CPTH'?'selected':''}>CPTH</option><option value="AMTH" ${prefix==='AMTH'?'selected':''}>AMTH</option></select>
            <input id="f_num" type="number" class="input w-2/3 font-mono text-lg" placeholder="ตัวเลข 4 หลัก" value="${num}">
          </div>
        </div>
        
        <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">📍 ระยะทาง (กิโลเมตร) <span class="text-red-500">*</span></label><input id="f_dist" type="number" step="0.01" class="input font-bold text-blue-600 text-lg" placeholder="เช่น 1.5" value="${d.DistanceKM}" oninput="calcFee()"></div>
        
        <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">👤 ชื่อลูกค้า</label><input id="f_cust" type="text" class="input" placeholder="ระบุชื่อลูกค้า (ถ้ามี)" value="${d.CustomerName}"></div>
        
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">💰 ยอดเก็บเงินลูกค้า</label><input id="f_total" type="number" class="input" placeholder="บาท" value="${d.TotalPrice}"></div>
          <div><label class="text-xs font-bold text-slate-500 mb-1 ml-1 block">💳 วิธีชำระเงิน</label><select id="f_pay" class="input bg-slate-50"><option ${d.PaymentMethod==='เงินสด'?'selected':''}>เงินสด</option><option ${d.PaymentMethod==='โอน/เครดิต'?'selected':''}>โอน/เครดิต</option><option ${d.PaymentMethod==='TrueWallet'?'selected':''}>TrueWallet</option></select></div>
        </div>
      </div>
    </div>
  `;
  openModal(id ? '✏️ แก้ไขข้อมูลงาน' : '🛵 บันทึกงานใหม่', html, `<button onclick="closeModal()" class="btn btn-secondary flex-1 py-3">ยกเลิก</button><button id="btnSave" onclick="submitOrder()" class="btn btn-primary flex-1 py-3">บันทึกข้อมูล</button>`);
  if(id) calcFee();
}

function submitOrder() {
  const num = el('f_num').value.trim(); const dist = el('f_dist').value;
  if(!num || !dist) return Swal.fire('แจ้งเตือน', 'กรุณาใส่เลขออเดอร์และระยะทางให้ครบ', 'warning');
  
  const data = {
    OrderID: el('f_id').value, OrderDate: el('f_date').value, OrderRef: el('f_prefix').value + num, CustomerName: el('f_cust').value, DistanceKM: dist, FeeTHB: el('f_fee').value, TotalPrice: el('f_total').value||0, PaymentMethod: el('f_pay').value
  };
  
  el('btnSave').disabled = true; el('btnSave').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  gas('saveOrder', data, State.user).then(res => { closeModal(); Swal.fire('สำเร็จ', res, 'success'); loadCurrentPage(); }).catch(e => { Swal.fire('Error', e.message, 'error'); el('btnSave').disabled = false; el('btnSave').innerHTML = 'บันทึกข้อมูล'; });
}

function deleteOrder(id) {
  Swal.fire({ title: 'ยืนยันลบข้อมูล?', text: "ไม่สามารถกู้คืนได้", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33' }).then(res => {
    if(res.isConfirmed) { Swal.showLoading(); gas('deleteOrder', id, State.user).then(r => { Swal.fire('ลบแล้ว!', '', 'success'); loadCurrentPage(); }).catch(e => Swal.fire('Error', e.message, 'error')); }
  });
}

/* ========================================================
   หน้าสรุปผล / รีพอร์ต / เบิกจ่ายเงิน
   ======================================================== */
async function render_report() {
  el('content').innerHTML = `
    <div class="bg-white rounded-2xl shadow-sm border p-4 md:p-5 mb-4">
      <h3 class="font-bold text-slate-700 text-sm mb-3"><i class="fa-solid fa-filter text-main mr-1"></i> กรองข้อมูลรอบบิล</h3>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><label class="text-[10px] font-bold text-slate-500 ml-1">ปี</label><select id="r_year" class="input bg-slate-50 py-1.5 text-xs border-none font-bold"></select></div>
        <div><label class="text-[10px] font-bold text-slate-500 ml-1">เดือน</label><select id="r_month" class="input bg-slate-50 py-1.5 text-xs border-none font-bold"></select></div>
        <div class="col-span-2"><label class="text-[10px] font-bold text-slate-500 ml-1">รอบวันที่ (Period)</label><select id="r_period" class="input bg-blue-50 py-1.5 text-sm font-bold text-blue-600 border-none"><option value="1">ครึ่งเดือนแรก (วันที่ 1 - 14)</option><option value="2">ครึ่งเดือนหลัง (วันที่ 15 - สิ้นเดือน)</option></select></div>
        ${State.user.Role === 'admin' ? `<div class="col-span-2"><label class="text-[10px] font-bold text-slate-500 ml-1">ไรเดอร์</label><select id="r_driver" class="input bg-slate-50 py-1.5 text-sm border-none"><option value="ALL">รวมทุกคน</option></select></div>` : `<input type="hidden" id="r_driver" value="${State.user.FullName}">`}
      </div>
      <button onclick="fetchReport()" class="btn bg-slate-800 hover:bg-slate-700 active:scale-95 text-white w-full py-3 shadow-md rounded-xl"><i class="fa-solid fa-file-invoice mr-2"></i> ดึงข้อมูลรีพอร์ต</button>
    </div>
    <div id="reportContainer"></div>
  `;
  
  const d = new Date();
  const ys = el('r_year'); for(let y=2024; y<=2030; y++) ys.add(new Option(y, y)); ys.value = d.getFullYear();
  const ms = el('r_month'); const mNames = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  for(let m=1; m<=12; m++) ms.add(new Option(mNames[m-1], m)); ms.value = d.getMonth()+1;
  el('r_period').value = d.getDate() <= 14 ? "1" : "2";

  if(State.user.Role === 'admin') {
    gas('getUsers').then(users => {
      const ds = el('r_driver'); users.forEach(u => { if(u.Role !== 'admin') ds.add(new Option(u.FullName, u.FullName)); });
    });
  }
}

window.fetchReport = async function() {
  const y = parseInt(el('r_year').value); const m = parseInt(el('r_month').value); const p = el('r_period').value; const drv = el('r_driver').value;
  el('reportContainer').innerHTML = `<div class="text-center py-10 text-main"><i class="fa-solid fa-spinner fa-spin text-3xl"></i></div>`;
  
  try {
    const res = await gas('getSummaryReport', y, m, p, drv, State.user.UserID, State.user.Role);
    let html = `
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-5 mb-4 text-white shadow-md relative overflow-hidden">
        <i class="fa-solid fa-coins absolute -right-2 -bottom-2 text-7xl opacity-20"></i>
        <p class="text-[10px] font-bold opacity-80 mb-1 uppercase tracking-wider">สรุปรวมค่ารอบ (Period ${p})</p>
        <div class="flex justify-between items-end relative z-10">
          <h2 class="text-4xl font-black">฿${res.totalFee}</h2>
          <div class="text-right bg-white/20 px-3 py-1.5 rounded-xl backdrop-blur-sm"><p class="text-[9px] opacity-80 uppercase font-bold">จำนวนงาน</p><p class="font-bold text-xl leading-none">${res.totalJobs}</p></div>
        </div>
      </div>`;
    
    if(State.user.Role === 'admin' && drv === 'ALL') {
      html += `<div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-4"><table class="w-full text-sm text-left"><thead class="bg-slate-50 border-b"><tr><th class="p-3 font-bold text-slate-500">ไรเดอร์</th><th class="p-3 text-center font-bold text-slate-500">งาน</th><th class="p-3 text-right font-bold text-slate-500">ยอดเงิน</th></tr></thead><tbody class="divide-y">`;
      for(let k in res.summary) { html += `<tr><td class="p-3 font-bold text-slate-700">${k}</td><td class="p-3 text-center"><span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md text-xs font-bold">${res.summary[k].jobs}</span></td><td class="p-3 text-right font-black text-emerald-600">฿${res.summary[k].amount}</td></tr>`; }
      html += `</tbody></table></div>`;
    }

    if(State.user.Role === 'admin') {
      html += `<button onclick="approveSettle()" class="btn w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white py-3.5 shadow-lg shadow-emerald-500/30 rounded-xl mb-6 text-base"><i class="fa-solid fa-check-double mr-2"></i> อนุมัติเบิกจ่ายรอบนี้</button>`;
    }

    html += `<h4 class="font-bold text-sm text-slate-700 mb-2"><i class="fa-solid fa-list-ol text-slate-400 mr-1"></i> รายการวิ่งงาน</h4><div class="space-y-2">`;
    if(res.details.length === 0) html += `<div class="p-6 text-center text-slate-400 border border-dashed rounded-xl bg-white text-xs">ไม่พบข้อมูลในรอบบิลนี้</div>`;
    res.details.forEach(o => {
      let isPaid = o.Status === 'จ่ายแล้ว';
      html += `
        <div class="bg-white p-3 rounded-xl border shadow-sm flex justify-between items-center ${isPaid?'opacity-60 bg-slate-50':''}">
          <div>
            <div class="flex items-center gap-2"><span class="font-bold text-sm text-slate-800">${o.OrderRef}</span> ${isPaid?`<span class="badge-paid text-[8px] px-1.5 py-0.5 rounded font-bold">จ่ายแล้ว</span>`:''}</div>
            <p class="text-[10px] text-slate-500 mt-0.5">${String(o.OrderDate).substring(0,10)} | ${o.DistanceKM} กม.</p>
          </div>
          <div class="font-bold text-emerald-600 text-base">+฿${o.FeeTHB}</div>
        </div>`;
    });
    html += `</div>`;
    el('reportContainer').innerHTML = html;
  } catch(e) { el('reportContainer').innerHTML = errorHtml(e); }
}

window.approveSettle = function() {
  const y = el('r_year').value; const m = el('r_month').value; const p = el('r_period').value; const drv = el('r_driver').value;
  Swal.fire({ title: 'ยืนยันการอนุมัติจ่ายเงิน?', text: "รายการทั้งหมดในรอบนี้จะถูกล็อกสถานะเป็น 'จ่ายแล้ว' และไม่สามารถแก้ไขได้อีก", icon: 'warning', showCancelButton: true, confirmButtonText: 'ยืนยันจ่ายเงิน' }).then(res => {
    if(res.isConfirmed) {
      Swal.showLoading();
      gas('settlePayment', y, m, p, drv, State.user.Role).then(count => {
        Swal.fire('สำเร็จ', `อัปเดตสถานะจ่ายแล้วจำนวน ${count} รายการ`, 'success'); fetchReport();
      }).catch(e => Swal.fire('Error', e.message, 'error'));
    }
  });
}
